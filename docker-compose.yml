name: trade-risk

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    profiles: ["kafka", "cdc", "flink"]
    ports:
      - "9094:9094"
    environment:
      # One server acting as both broker and controller (KRaft mode).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Listeners: where Kafka binds, and the address it tells clients to use.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Internal topics default to 3 replicas, which one broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics must be created on purpose, so a typo can't invent a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Local-only speedups, so experiments show results in seconds.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000

      KAFKA_HEAP_OPTS: -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    profiles: ["kafka", "cdc", "flink"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    container_name: postgres
    profiles: ["cdc"]
    # logical = record enough in the WAL to rebuild row changes. The default,
    # replica, only supports copying whole disk blocks.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: refdata
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      # Runs once, only when the data volume is empty.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      # -h forces TCP. The temporary server used during init only listens on a
      # socket, so this can't report healthy before the seed has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d refdata"]
      interval: 5s
      timeout: 5s
      retries: 12

  debezium:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: debezium
    profiles: ["cdc"]
    ports:
      - "8083:8083"  # Kafka Connect's REST API
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      # Workers sharing a GROUP_ID form one Connect cluster.
      GROUP_ID: debezium-connect
      # Connect keeps its own state in Kafka: connector configs, how far each
      # connector has read, and whether it is running.
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      HEAP_OPTS: -Xms256m -Xmx512m
    # Above the heap because the image loads every Debezium connector plugin.
    mem_limit: 1280m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  jobmanager:
    build: ./flink
    image: trade-risk-flink:2.2.1
    container_name: jobmanager
    profiles: ["flink"]
    command: jobmanager
    ports:
      - "8081:8081"  # Flink web UI and REST API
    environment:
      # Appended to Flink's config.yaml when the container starts.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        execution.checkpointing.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      # The SQL client runs here, so saved jobs only need to be visible here.
      - ./flink/sql:/opt/flink/sql:ro
    # Above Flink's 768m because the SQL client runs in this container too.
    mem_limit: 1024m
    depends_on:
      kafka:
        condition: service_healthy

  taskmanager:
    build: ./flink
    image: trade-risk-flink:2.2.1
    container_name: taskmanager
    profiles: ["flink"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 8
        execution.checkpointing.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    mem_limit: 2304m
    depends_on:
      - jobmanager

volumes:
  kafka-data:
  postgres-data:
  flink-checkpoints:
